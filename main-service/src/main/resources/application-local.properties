# ===============================
# Postgres Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/jpa_epam
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000

# ===============================
# Logging
# ===============================
logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# Environment specific
# ===============================
info.environment=local-development
info.database=PostgreSQL Local
info.notes=Local development with PostgreSQL Docker container

# ===============================
# Eureka client configuration
# ===============================
spring.application.name=main-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Set a different port for main-service (Eureka runs on 8761)
# ===============================
server.port=8080