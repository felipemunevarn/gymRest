# ===============================
# Postgres Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/jpa_epam
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=300000

# ===============================
# Logging
# ===============================
logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.io.github.resilience4j=DEBUG

# ===============================
# Environment specific
# ===============================
info.environment=local-development
info.database=PostgreSQL Local
info.notes=Local development with PostgreSQL Docker container

# ===============================
# Eureka client configuration
# ===============================
spring.application.name=main-service
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ===============================
# Set a different port for main-service (Eureka runs on 8761)
# ===============================
server.port=8080

# ===============================
# Feign + Resilience4j
# ===============================
feign.circuitbreaker.enabled=true

# ===============================
# Resilience4j configuration
# ===============================
resilience4j.circuitbreaker.instances.trainerWorkloadClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.trainerWorkloadClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkloadClient.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkloadClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkloadClient.wait-duration-in-open-state=10s

# ===============================
# Circuit Breaker Configuration for Trainer Workload Service
# ===============================
resilience4j.circuitbreaker.instances.trainer-workload-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.trainer-workload-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainer-workload-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainer-workload-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.trainer-workload-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.trainer-workload-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainer-workload-service.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.trainer-workload-service.slow-call-duration-threshold=2s

# ===============================
# Retry Configuration
# ===============================
resilience4j.retry.instances.trainer-workload-service.max-attempts=3
resilience4j.retry.instances.trainer-workload-service.wait-duration=1s
resilience4j.retry.instances.trainer-workload-service.exponential-backoff-multiplier=2

# ===============================
# Timeout Configuration
# ===============================
resilience4j.timelimiter.instances.trainer-workload-service.timeout-duration=3s

