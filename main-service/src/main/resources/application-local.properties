# ===============================
# Postgres Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/jpa_epam
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA/Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.data-locations=classpath:data.sql

# ===============================
# Logging
# ===============================
logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# Environment specific
# ===============================
info.environment=local-development
info.database=PostgreSQL Local
info.notes=Local development with PostgreSQL Docker container