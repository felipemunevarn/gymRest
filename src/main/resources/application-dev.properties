# ===============================
# H2 Database Configuration
# ===============================
spring.datasource.url=jdbc:h2:~/gym;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# JPA/Hibernate Configuration
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.data-locations=classpath:data-dev.sql

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.com.epam.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# Environment specific
# ===============================
info.environment=development
info.database=H2 In-Memory
info.notes=This is the development environment with H2 database