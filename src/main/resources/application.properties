spring.application.name=gym

# ===============================
# H2 Database Configuration
# ===============================
#spring.datasource.url=jdbc:h2:~/gym;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.username=sa
#spring.datasource.password=
#spring.datasource.driver-class-name=org.h2.Driver

# ===============================
# Postgres Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA/Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

#spring.jpa.show-sql=true

# ===============================
# H2 Console (Optional)
# ===============================
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console

# ===============================
# Logging
# ===============================
# Enable ANSI colors
spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%2p) %clr(${PID}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} [%thread] %-5level %logger{36} - [%X{transactionId}] %msg%n

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=when_authorized
management.endpoint.info.enabled=true
management.info.env.enabled=true

# ===============================
# Basic information
# ===============================
info.app.name=My Gym Application
info.app.description=A comprehensive gym management system
info.app.version=1.0.0
info.app.encoding=@project.build.sourceEncoding@
info.app.java.version=@java.version@

# ===============================
# Custom information
# ===============================
info.company.name=EPAM
info.company.website=https://epam.com
info.developer.name=Felipe Munevar
info.developer.email=felipemunevarn@gmail.com

# ===============================
# Environment specific
# ===============================
info.environment=development
info.database=PostgreSQL