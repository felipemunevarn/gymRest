server:
  port: 8082

spring:
  application:
    name: trainer-workload-service
  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  jms:
    template:
      delivery-mode: persistent
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  data:
    mongodb:
      host: localhost
      port: 27017
      database: gym_workload_db
      authentication-database: admin
      username: ${MONGO_USERNAME:admin}
      password: ${MONGO_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# JWT Configuration
jwt:
  secret: 870fc857a079157a69c5c03a8788a0c4721d90f8fe35476d1bce3609fc2ede4f
  expiration: 86400000

# Logging Configuration
logging:
  level:
    com.epam.gym.workload: DEBUG
    org.springframework.cloud: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

app:
  queue:
    trainer-workload: trainer.workload.updates